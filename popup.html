<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Clash 节点雷达</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #10B981;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 6px #10B981;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .domain-title {
      font-size: 12px;
      color: #94A3B8;
      margin-bottom: 4px;
    }
    .current-domain {
      font-size: 15px;
      font-weight: 600;
      color: #FFFFFF;
      word-break: break-all;
      margin-bottom: 12px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .row:last-child { margin-bottom: 0; }
    .label { color: #94A3B8; }
    .val { font-weight: 600; text-align: right; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .val-green { color: #34D399; }
    .val-gray { color: #CBD5E1; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-proxy { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-direct { background: rgba(148, 163, 184, 0.15); color: #E2E8F0; border: 1px solid rgba(148, 163, 184, 0.3); }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748B;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .switch-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #94A3B8;
    }
    .btn-link {
      background: none;
      border: none;
      color: #10B981;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
    }
    .btn-link:hover { text-decoration: underline; }
    .settings-panel {
      display: none;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .settings-panel.active { display: block; }
    .input-group {
      margin-bottom: 8px;
    }
    .input-group label {
      display: block;
      color: #94A3B8;
      margin-bottom: 3px;
    }
    .input-group input {
      width: 100%;
      padding: 5px 8px;
      background: #1E293B;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #F8FAFC;
      font-size: 11px;
    }
    .btn-save {
      width: 100%;
      padding: 5px;
      background: #10B981;
      color: #FFF;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="status-dot" id="statusDot"></span>
      <span>Clash 节点雷达</span>
    </div>
    <div class="header-actions">
      <button class="btn-link" id="settingsToggle">⚙️ 设置</button>
      <button class="btn-link" id="refreshBtn">刷新</button>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="input-group">
      <label>控制器地址 (Host)</label>
      <input type="text" id="cfgHost" value="127.0.0.1">
    </div>
    <div class="input-group">
      <label>控制器端口 (Port)</label>
      <input type="text" id="cfgPort" placeholder="9097 或 9090" value="9097">
    </div>
    <div class="input-group">
      <label>密钥 (Secret, 若无留空)</label>
      <input type="password" id="cfgSecret" placeholder="如无密码请留空">
    </div>
    <button class="btn-save" id="saveSettingsBtn">保存并测试连接</button>
  </div>

  <div class="domain-title">当前网页标签</div>
  <div class="current-domain" id="tabDomain">正在检测...</div>

  <div class="card">
    <div class="row">
      <span class="label">出站去向</span>
      <span class="badge badge-proxy" id="nodeBadge">检测中</span>
    </div>
    <div class="row">
      <span class="label">节点名称</span>
      <span class="val val-green" id="nodeName">-</span>
    </div>
    <div class="row">
      <span class="label">匹配规则</span>
      <span class="val" id="ruleName">-</span>
    </div>
    <div class="row">
      <span class="label">标签流量</span>
      <span class="val" id="trafficStats">↓ 0 B · ↑ 0 B</span>
    </div>
  </div>

  <div class="footer">
    <label class="switch-label">
      <input type="checkbox" id="pillToggle" checked>
      <span>页面右下角悬浮球</span>
    </label>
    <span id="connStatus">Mihomo</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
